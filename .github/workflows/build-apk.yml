name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "릴리스(서명) APK 빌드 — Play 업로드용"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.gradle/caches
          key: android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: android-${{ runner.os }}-

      # ─────────────────────────────────────────────────────────────
      # 디버그 APK — 항상 빌드. 서명키 불필요, 테스트 광고 단위 사용.
      # ─────────────────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ─────────────────────────────────────────────────────────────
      # 릴리스 APK — 서명키가 있을 때만. 없으면 건너뜁니다.
      # ─────────────────────────────────────────────────────────────
      - name: Decode upload keystore
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::UPLOAD_KEYSTORE_BASE64 secret 이 없어 릴리스 빌드를 건너뜁니다."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > my-upload-key.jks
          echo "keystore restored"

      - name: Build release APK
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PATH: ${{ format('{0}/my-upload-key.jks', github.workspace) }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -f my-upload-key.jks ]; then
            echo "::notice::keystore 없음 — 릴리스 빌드 스킵"
            exit 0
          fi
          ./gradlew :app:assembleRelease

      - name: Build release AAB
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) && secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        run: ./gradlew :app:bundleRelease

      - name: Upload release artifacts
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) && secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30