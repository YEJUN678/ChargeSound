name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "릴리스(서명) APK 빌드 — 스토어 배포용"
        type: boolean
        default: false

# 서명키가 설정된 경우에만 릴리스 단계를 돌린다.
# github.event.inputs는 push 이벤트에서 안전하게 null을 반환한다.
# (inputs 컨텍스트는 workflow_dispatch에서만 존재하므로 push에서 참조하면
#  워크플로우 파싱 단계에서 "Unrecognized named-value" 오류로 Job이 생성되지 않는다)
env:
  HAS_KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle and Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/sdk
          key: android-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: android-${{ runner.os }}-

      # debug.keystore는 .gitignore 대상이라 리포지토리에 없습니다.
      # app/build.gradle.kts의 debugConfig가 이 파일을 요구하므로 CI에서 생성합니다.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # ────────────────────────────────────────────────────────
      # 디버그 APK — 항상 빌드. 서명키 불필요, 테스트 광고 단위.
      # ────────────────────────────────────────────────────────
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # ────────────────────────────────────────────────────────
      # 릴리스 — 서명키가 있을 때만
      # ────────────────────────────────────────────────────────
      - name: Restore upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # 붙여넣기 과정에서 줄바꿈/공백이 섞여도 복구되도록 정리합니다.
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ')
          printf '%s' "$CLEAN" | base64 --decode > my-upload-key.jks
          SIZE=$(stat -c%s my-upload-key.jks)
          echo "keystore restored: ${SIZE} bytes"
          if [ "$SIZE" -lt 500 ]; then
            echo "::error::keystore 크기가 비정상($SIZE bytes). base64가 잘렸을 수 있습니다."
            exit 1
          fi
          # keystore는 ZIP 형식(PK 헤더)이라 이것만으로 복원 성공을 확인할 수 있습니다
          if [ "$(head -c2 my-upload-key.jks)" != "PK" ]; then
            echo "::error::keystore 헤더가 올바르지 않습니다."
            exit 1
          fi
          keytool -list -keystore my-upload-key.jks -storepass "$KEYSTORE_PASSWORD" | head -5

      - name: Build release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release artifacts
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Skip notice
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::notice::서명키 secret 이 없어 릴리스 빌드를 건너뜁니다. 디버그 APK만 생성됩니다."